  # The document-skills plugin.
  anthropics/skills:
    commit: e4bb5d960d87126ff3b3a8af1a104b7db67560ba  # main on 2026-11-17
    skills:
      - xlsx
      - docx
      - pptx
      - pdf
  # The rocprofiler-sdk and rocprofiler-compute profiling skills. Its
  # submodules (perfetto, opencode, rccl's dependencies) add some 6 minutes to
